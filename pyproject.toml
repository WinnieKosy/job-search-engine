[project]
name = "jobagent"
version = "0.1.0"
description = "Local AI agent that finds jobs, tailors your CV and cover letter, and fills applications for your approval."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "playwright>=1.45",
    "pyyaml>=6",
    "pypdf>=4",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "flask>=3.0",
]

[project.scripts]
jobagent = "jobagent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jobagent.web" = ["static/*"]
