# Copy to config/profile.yaml and fill in. profile.yaml is git-ignored.

cv_path: config/my_cv.pdf          # .pdf, .docx, .md or .txt

llm:
  provider: ollama
  model: qwen3:14b                 # fits an 18 GB Mac; try gemma3:12b too
  host: http://localhost:11434
  num_ctx: 12288

personal:
  first_name: Jane
  last_name: Doe
  email: jane@example.com
  phone: "+44 7700 900000"
  country: United Kingdom          # used for the phone-country picker
  location: London, UK
  linkedin: https://www.linkedin.com/in/janedoe
  github: ""
  website: ""

# Facts the model may use when answering questions (not on your CV).
facts:
  notice_period: 1 month
  work_authorisation: UK citizen

# Fixed answers. `match` is a regex checked against each question's label.
# These win over anything the model would write.
answers:
  - match: "require.*sponsorship|visa sponsorship"
    answer: "No"
  - match: "authori[sz]ed to work|legally (able|eligible)"
    answer: "Yes"
  - match: "open to relocat|willing to relocate"
    answer: "No"
  - match: "in-person|in person|hybrid"
    answer: "Yes"
  - match: "how did you hear"
    answer: "Company careers page"

eeo: decline                       # choose "decline to answer" on optional diversity questions
salary_expectation: ""             # leave empty to be asked each time

# A paragraph you wrote yourself, so letters sound like you.
writing_sample: |


search:
  sources: [greenhouse]
  greenhouse_boards: [anthropic, stripe, airbnb]   # company slug from job-boards.greenhouse.io/<slug>
  keywords: [engineer, developer]
  exclude_keywords: [senior staff, principal, intern]
  locations: [London, Remote, UK]
  min_fit_score: 65
  max_jobs_to_score: 30

apply:
  auto_submit: false               # true = submit without asking when nothing needs you
  headless: false                  # keep false so you can watch and step in
  delay_seconds: [30, 90]          # pause between submissions
